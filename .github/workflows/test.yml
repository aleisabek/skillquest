# Every push and pull request runs the full suite: the Node checks (content, generators, daily loop,
# progress safety...) and every break-and-fix lab end to end on a real Ubuntu machine.
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5   # the SQLite answer check runs as `python`
        with:
          python-version: '3.12'
      - name: Node checks (npm test)
        run: npm test
  labs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for the secret-leak lab
        run: git config --global init.defaultBranch main
      - name: Allow the net-discover lab network (unprivileged user namespaces + bridge, as on a normal WSL Ubuntu)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo modprobe bridge || true
          unshare -Urn true && echo "user namespaces OK"
      - name: Every lab end to end (right, alternative, insecure, broken and crash fixes)
        env:
          SQ_TEST_ROOT: "1"   # CI only: also check that sq-lab refuses to run as real root
        run: bash labs/test-labs.sh
